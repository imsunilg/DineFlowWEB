name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build --configuration production
      - name: No hard-coded business identity in the UI
        run: "! grep -rniE 'dineflow|agentjack' src/app src/index.html"

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dineflow-web:ci .
